<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Earn - Official Mini App</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Monetag Ad Tag SDK (Zone: 12199472) -->
  <script src="//libtl.com/sdk.js" data-zone="12199472" data-sdk="show_12199472"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #121927;
      --accent: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.25);
      --text: #ffffff;
      --text-muted: #8b9bb4;
      --danger: #ff4757;
      --success: #2ed573;
      --gold: #ffa502;
      --purple: #8e44ad;
      --border-color: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 14px 14px 40px; user-select: none; }
    
    /* Top Header */
    .header { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 14px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: #162235; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: var(--accent); }
    .badge { font-size: 11px; color: var(--accent); background: rgba(0,255,204,0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(0,255,204,0.3); font-weight: 600; }

    /* Total Balance Card */
    .balance-card { width: 100%; max-width: 450px; background: linear-gradient(135deg, #131b2e 0%, #090e18 100%); border: 1px solid rgba(0,255,204,0.25); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 14px; box-shadow: 0 8px 24px var(--accent-glow); }
    .balance-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .balance-amount { font-size: 36px; font-weight: 800; color: var(--accent); margin: 6px 0; }
    .balance-sub { font-size: 11px; color: var(--text-muted); }

    /* Stats Grid */
    .stats-card { width: 100%; max-width: 450px; background: var(--card-bg); border-radius: 14px; padding: 12px; display: flex; justify-content: space-around; margin-bottom: 14px; border: 1px solid var(--border-color); }
    .stat-item { text-align: center; }
    .stat-val { font-size: 15px; font-weight: 700; color: #fff; }
    .stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* Action Buttons Grid */
    .btn-grid { width: 100%; max-width: 450px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .btn { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: transform 0.1s, background 0.2s; }
    .btn:active { transform: scale(0.97); }
    .btn-main { grid-column: span 2; background: linear-gradient(90deg, #00cec9, #00b894); color: #000; border: none; font-size: 16px; font-weight: 800; padding: 16px; box-shadow: 0 4px 15px rgba(0, 206, 201, 0.3); }
    .btn-gold { background: linear-gradient(90deg, #f39c12, #e67e22); color: #000; border: none; }
    .btn-danger { border-color: rgba(255, 71, 87, 0.4); }

    /* Section Containers */
    .section-card { width: 100%; max-width: 450px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 15px; margin-bottom: 14px; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    /* Tasks List */
    .task-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .task-item:last-child { border-bottom: none; }
    .task-desc { font-size: 13px; font-weight: 500; }
    .task-reward { font-size: 11px; color: var(--accent); }
    .task-btn { background: rgba(0,255,204,0.1); border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }

    /* Custom Popup Overlays */
    .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 999999; padding: 20px; }
    .popup-box { background: #131a29; border: 1px solid var(--accent); border-radius: 16px; width: 100%; max-width: 350px; padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .popup-title { font-size: 17px; font-weight: bold; margin-bottom: 10px; }
    .popup-msg { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; word-break: break-all; }
    .popup-btn { background: var(--accent); color: #000; font-weight: bold; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; width: 100%; }
    .input-box { width: 100%; background: #0b1019; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 11px; color: #fff; margin-bottom: 12px; font-size: 13px; outline: none; }
    .input-box:focus { border-color: var(--accent); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="user-info">
      <div class="avatar" id="u-avatar">U</div>
      <div>
        <div style="font-weight: 700; font-size: 14px;" id="u-name">Cyber Player</div>
        <div style="font-size: 11px; color: var(--text-muted);" id="u-id">ID: ...</div>
      </div>
    </div>
    <div class="badge">BEP-20 Live</div>
  </div>

  <!-- Total Balance Display -->
  <div class="balance-card">
    <div class="balance-label">Total Balance</div>
    <div class="balance-amount">$<span id="bal-val">0.0000</span></div>
    <div class="balance-sub">Tether USD (USDT BEP-20)</div>
  </div>

  <!-- User Stats -->
  <div class="stats-card">
    <div class="stat-item">
      <div class="stat-val" id="st-watched">0 / 500</div>
      <div class="stat-lbl">Today Ads</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="st-refs">0</div>
      <div class="stat-lbl">Referrals</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="st-min-wd">$0.03</div>
      <div class="stat-lbl">Min Withdraw</div>
    </div>
  </div>

  <!-- Primary Earn Actions -->
  <div class="btn-grid">
    <button class="btn btn-main" id="btn-watch-ad">
      <span style="font-size: 20px;">⚡</span>
      <span>Watch Ad & Earn ($<span id="cfg-reward">0.003</span>)</span>
    </button>
    <button class="btn btn-gold" id="btn-daily-bonus">
      <span>🎁 Daily Bonus</span>
    </button>
    <button class="btn" id="btn-invite">
      <span>👥 Invite Friends</span>
    </button>
    <button class="btn btn-danger" id="btn-withdraw-modal">
      <span style="color: var(--danger);">💳 Withdraw USDT</span>
    </button>
  </div>

  <!-- Official Tasks Section -->
  <div class="section-card">
    <div class="section-title">📋 Official Channel Tasks</div>
    <div class="task-item">
      <div>
        <div class="task-desc">Join Official Telegram Channel</div>
        <div class="task-reward">+ $0.005 USDT</div>
      </div>
      <button class="task-btn" onclick="openChannel()">Join</button>
    </div>
  </div>

  <!-- Alert Modal -->
  <div class="popup-overlay" id="popup-box">
    <div class="popup-box">
      <div class="popup-title" id="pop-title">သတိပေးချက်</div>
      <div class="popup-msg" id="pop-msg">...</div>
      <button class="popup-btn" id="pop-ok-btn">OK</button>
    </div>
  </div>

  <!-- Withdraw Modal -->
  <div class="popup-overlay" id="withdraw-modal">
    <div class="popup-box">
      <div class="popup-title" style="color: var(--accent);">USDT BEP-20 ထုတ်ယူရန်</div>
      <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 12px;">$0.03 မှ $0.50 အထိ Auto စနစ်ဖြင့် တိုက်ရိုက် ထုတ်ပေးပါသည်</div>
      <input type="text" class="input-box" id="wd-address" placeholder="BEP-20 Address (0x...)">
      <input type="number" step="0.001" class="input-box" id="wd-amount" placeholder="ထုတ်ယူမည့်ပမာဏ (e.g. 0.05)">
      <div style="display: flex; gap: 8px;">
        <button class="popup-btn" style="background: #334155; color: #fff; flex: 1;" id="wd-cancel-btn">မလုပ်တော့ပါ</button>
        <button class="popup-btn" style="flex: 1;" id="wd-confirm-btn">ငွေထုတ်မည်</button>
      </div>
    </div>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = "https://ohhzbeayfccoiqevydat.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oaHpiZWF5ZmNjb2lxZXZ5ZGF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY2Mzg4NzYsImV4cCI6MjA2MjIxNDg3Nn0.7bWv8WkI-KzXpWbXW1iJ5o0V7xH7L9iJ0kK1lM2nO3p";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Bot Configuration
    const BOT_USERNAME = "CyberEarns_bot";
    const ADMIN_ID = 6093710107;
    const MAX_DAILY_ADS = 500;
    const OFFICIAL_CHANNEL = "https://t.me/Tonsarsar";

    let tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const user = tg?.initDataUnsafe?.user || { id: 6093710107, first_name: "Admin" };
    const IS_ADMIN = (Number(user.id) === Number(ADMIN_ID));

    let currentBalance = 0.0000;
    let config = { ad_reward: 0.003, min_withdraw: 0.03, daily_bonus: 0.005 };

    // Notification Popup Logic
    function showAlert(title, msg) {
      document.getElementById('pop-title').innerText = title;
      document.getElementById('pop-msg').innerText = msg;
      document.getElementById('popup-box').style.display = 'flex';
    }
    document.getElementById('pop-ok-btn').addEventListener('click', () => {
      document.getElementById('popup-box').style.display = 'none';
    });

    // Daily Limit Local Storage
    function getDailyAdCount() {
      const today = new Date().toISOString().slice(0, 10);
      const data = JSON.parse(localStorage.getItem(`ads_${user.id}`) || '{}');
      return data.date === today ? (data.count || 0) : 0;
    }
    function incrementDailyAdCount() {
      const today = new Date().toISOString().slice(0, 10);
      const count = getDailyAdCount() + 1;
      localStorage.setItem(`ads_${user.id}`, JSON.stringify({ date: today, count }));
      document.getElementById('st-watched').innerText = `${count} / ${MAX_DAILY_ADS}`;
    }

    // Initialize User Data
    async function initUser() {
      document.getElementById('u-name').innerText = user.first_name || "Cyber Player";
      document.getElementById('u-id').innerText = `ID: ${user.id}`;
      document.getElementById('u-avatar').innerText = (user.first_name || "U")[0].toUpperCase();
      document.getElementById('st-watched').innerText = `${getDailyAdCount()} / ${MAX_DAILY_ADS}`;

      try {
        const { data: cfg } = await supabase.from('cyber_settings').select('*').limit(1).maybeSingle();
        if (cfg) {
          config.ad_reward = Number(cfg.ad_reward) || 0.003;
          config.min_withdraw = Number(cfg.min_withdraw) || 0.03;
          config.daily_bonus = Number(cfg.daily_bonus) || 0.005;
          document.getElementById('cfg-reward').innerText = config.ad_reward;
          document.getElementById('st-min-wd').innerText = `$${config.min_withdraw}`;
        }

        const { data: uData } = await supabase.from('cyber_users').select('*').eq('user_id', user.id).maybeSingle();
        if (uData) {
          currentBalance = Number(uData.balance) || 0.0000;
          document.getElementById('bal-val').innerText = currentBalance.toFixed(4);
          document.getElementById('st-refs').innerText = uData.referrals_count || 0;
        } else {
          await supabase.from('cyber_users').insert([{ user_id: user.id, username: user.username || '', first_name: user.first_name || '', balance: 0.0000 }]);
        }
      } catch (err) {
        console.error("Init Error:", err);
      }
    }

    async function updateBalanceInDB(nBal) {
      currentBalance = nBal;
      document.getElementById('bal-val').innerText = currentBalance.toFixed(4);
      await supabase.from('cyber_users').update({ balance: nBal }).eq('user_id', user.id);
    }

    // Monetag Rewarded Interstitial Execution
    document.getElementById("btn-watch-ad").addEventListener("click", () => {
      const watched = getDailyAdCount();
      if (!IS_ADMIN && watched >= MAX_DAILY_ADS) {
        showAlert("သတိပေးချက်", `ယနေ့အတွက် Ads ${MAX_DAILY_ADS} ကြိမ် ပြည့်သွားပါပြီ။`);
        return;
      }

      // Monetag SDK Call
      if (typeof show_12199472 === 'function') {
        show_12199472().then(() => {
          incrementDailyAdCount();
          const nBal = Number((currentBalance + config.ad_reward).toFixed(4));
          updateBalanceInDB(nBal);
          showAlert("🎉 အောင်မြင်ပါသည်", `ကြော်ငြာကြည့်ရှုမှုအတွက် +$${config.ad_reward} USDT ရရှိပါသည်!`);
        }).catch((err) => {
          console.error("Monetag Error:", err);
          showAlert("သတိပေးချက်", "ကြော်ငြာရယူ၍ မရသေးပါခင်ဗျာ။ ခဏအကြာမှ ထပ်စမ်းပေးပါ။");
        });
      } else {
        showAlert("ခေတ္တစောင့်ပါ", "ကြော်ငြာ SDK ချိတ်ဆက်နေဆဲဖြစ်ပါသည်။ ခဏအကြာမှ ပြန်နှိပ်ပေးပါ။");
      }
    });

    // Daily Bonus
    document.getElementById("btn-daily-bonus").addEventListener("click", async () => {
      const today = new Date().toISOString().slice(0, 10);
      const lastClaim = localStorage.getItem(`bonus_${user.id}`);
      if (lastClaim === today) {
        showAlert("သတိပေးချက်", "ယနေ့အတွက် Daily Bonus ရယူပြီးပါပြီ။ မနက်ဖြန်မှ ပြန်လာခဲ့ပါ။");
        return;
      }
      localStorage.setItem(`bonus_${user.id}`, today);
      const nBal = Number((currentBalance + config.daily_bonus).toFixed(4));
      await updateBalanceInDB(nBal);
      showAlert("🎉 ဂုဏ်ယူပါသည်", `နေ့စဉ် Bonus +$${config.daily_bonus} USDT ရရှိပါသည်!`);
    });

    // Referral Friends Link
    document.getElementById("btn-invite").addEventListener("click", () => {
      const link = `https://t.me/${BOT_USERNAME}?start=${user.id}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(link);
        showAlert("🔗 Invite Link", `သင့် ဖိတ်ခေါ်လင့်ခ်ကို ကူးယူပြီးပါပြီ:\n\n${link}`);
      } else {
        showAlert("🔗 Invite Link", link);
      }
    });

    // Task Execution
    function openChannel() {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(OFFICIAL_CHANNEL);
      } else {
        window.open(OFFICIAL_CHANNEL, '_blank');
      }
    }

    // Withdraw Modal Controls
    document.getElementById("btn-withdraw-modal").addEventListener("click", () => {
      document.getElementById('withdraw-modal').style.display = 'flex';
    });
    document.getElementById("wd-cancel-btn").addEventListener("click", () => {
      document.getElementById('withdraw-modal').style.display = 'none';
    });

    // Withdraw Execution
    document.getElementById("wd-confirm-btn").addEventListener("click", async () => {
      const addr = document.getElementById('wd-address').value.trim();
      const amt = Number(document.getElementById('wd-amount').value);

      if (!addr.startsWith("0x") || addr.length !== 42) {
        showAlert("မှားယွင်းမှု", "မှန်ကန်သော BEP-20 (0x...) Wallet Address ကို ထည့်ပေးပါ။");
        return;
      }
      if (amt < config.min_withdraw) {
        showAlert("သတိပေးချက်", `အနည်းဆုံး ငွေထုတ်ယူခွင့်မှာ $${config.min_withdraw} ဖြစ်ပါသည်။`);
        return;
      }
      if (amt > currentBalance) {
        showAlert("လက်ကျန်ငွေမလုံလောက်ပါ", `သင့်လက်ကျန်ငွေမှာ $${currentBalance.toFixed(4)} သာ ရှိပါသည်။`);
        return;
      }

      const status = (amt <= 0.50) ? "Pending_Auto" : "Pending";
      const nBal = Number((currentBalance - amt).toFixed(4));
      
      await updateBalanceInDB(nBal);
      await supabase.from('cyber_withdrawals').insert([{
        user_id: user.id,
        amount: amt,
        wallet_address: addr,
        status: status,
        created_at: new Date().toISOString()
      }]);

      document.getElementById('withdraw-modal').style.display = 'none';
      if (status === "Pending_Auto") {
        showAlert("✅ တောင်းဆိုမှု အောင်မြင်သည်", `$${amt} USDT ကို Auto စနစ်ဖြင့် Wallet သို့ လွှဲပြောင်းပေးနေပါပြီ။ ခေတ္တစောင့်ပေးပါ။`);
      } else {
        showAlert("⏳ စောင့်ဆိုင်းဆဲ", `$${amt} USDT သည် ပမာဏများပြားသဖြင့် Admin စစ်ဆေးပြီးမှ လွှဲပြောင်းပေးပါမည်။`);
      }
    });

    initUser();
  </script>
</body>
</html>
