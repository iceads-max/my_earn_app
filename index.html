<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Earn Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #1a1a2e; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .card { background: #16213e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); margin-top: 20px; }
        .btn { background-color: #e94560; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 10px; margin-top: 20px; width: 100%; font-weight: bold; cursor: pointer; }
        h2 { color: #ffd369; }
        #loading { color: yellow; font-size: 14px; }
    </style>
</head>
<body>

    <h2 id="greeting">🔥 မင်္ဂလာပါ</h2>
    <p id="loading">ခဏစောင့်ပါ... ချိတ်ဆက်နေပါတယ်</p>
    
    <div class="card" style="display:none;" id="main-card">
        <p>လက်ကျန်ငွေ (Points)</p>
        <h1 id="balance">0</h1>
        <p style="color: #00ff88;">≈ $0.00 USDT</p>
    </div>

    <button class="btn" style="display:none;" id="earn-btn" onclick="earnPoints()">WATCH AD & EARN</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;

        const SUPABASE_URL = 'https://ohhzbeayfccoiqevydat.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZRsi0oPdmbAY-wimQ5Cx8A_b_g_PY41';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initApp() {
            if (!user) {
                document.getElementById('loading').innerText = "Telegram ကနေ ဖွင့်ပေးပါ။";
                return;
            }

            document.getElementById('greeting').innerText = `🔥 Welcome, ${user.first_name}`;

            // User ရှိမရှိ စစ်ဆေးခြင်း
            let { data: dbUser, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('id', user.id)
                .single();

            // Error တက်ရင် မျက်နှာပြင်မှာ ပြမယ်
            if (error && error.code !== 'PGRST116') { // PGRST116 ဆိုတာ User မရှိသေးလို့ ဖြစ်တဲ့ Error ပါ၊ အဲ့ဒါကို ကျော်မယ်
                document.getElementById('loading').innerText = "Error 1: " + error.message;
                return;
            }

            // User မရှိသေးရင် အသစ်ထည့်မယ်
            if (!dbUser) {
                const { data: newUser, error: insertError } = await supabaseClient
                    .from('users')
                    .insert([{ id: user.id, first_name: user.first_name, balance: 0 }])
                    .select()
                    .single();
                
                if (insertError) {
                    document.getElementById('loading').innerText = "Error 2: " + insertError.message;
                    return;
                }
                dbUser = newUser;
            }

            // အားလုံးအောင်မြင်ရင် ပြမယ်
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-card').style.display = 'block';
            document.getElementById('earn-btn').style.display = 'block';
            document.getElementById('balance').innerText = dbUser.balance;
        }

        async function earnPoints() {
            const currentBalance = parseInt(document.getElementById('balance').innerText);
            const newBalance = currentBalance + 10;

            const { error } = await supabaseClient
                .from('users')
                .update({ balance: newBalance })
                .eq('id', user.id);

            if (!error) {
                document.getElementById('balance').innerText = newBalance;
                tg.HapticFeedback.impactOccurred('medium');
                tg.showAlert("ဂုဏ်ယူပါတယ်! 10 Points ရသွားပါပြီ။");
            } else {
                tg.showAlert("Error: " + error.message);
            }
        }

        initApp();
    </script>
</body>
</html>
