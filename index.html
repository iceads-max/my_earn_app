<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07090e;
      --card: rgba(15, 20, 34, 0.9);
      --border: rgba(0, 240, 255, 0.25);
      --cyan: #00f0ff;
      --green: #00ff88;
      --purple: #b026ff;
      --text: #ffffff;
      --dim: #79859f;
      --danger: #ff3366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 90px; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--cyan), var(--purple)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .status-badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(0, 255, 136, 0.1); border: 1px solid var(--green); color: var(--green); }

    .balance-box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 22px; text-align: center; box-shadow: 0 8px 30px rgba(0, 240, 255, 0.08); margin-bottom: 18px; position: relative; overflow: hidden; }
    .balance-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--cyan), var(--green)); }
    .balance-val { font-size: 38px; font-weight: 900; color: var(--green); margin: 6px 0; font-family: monospace; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .cyber-btn { border: none; border-radius: 14px; padding: 15px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .cyber-btn:active { transform: scale(0.97); }
    .btn-earn { background: linear-gradient(135deg, #00f0ff, #0077ff); color: #000; box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3); }
    .btn-withdraw { background: linear-gradient(135deg, #00ff88, #00aa44); color: #000; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3); }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--dim); font-size: 12px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: rgba(0,240,255,0.15); border-color: var(--cyan); color: var(--cyan); }

    .card-item { background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .btn-action { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-action:disabled { border-color: #262c3e; color: #555e75; background: transparent; cursor: not-allowed; }

    /* Modal Overlay */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.2s ease; padding: 20px; backdrop-filter: blur(8px); }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-box { background: #0f1422; border: 1px solid var(--cyan); border-radius: 20px; padding: 22px; width: 100%; max-width: 360px; }
    .modal-box input { width: 100%; padding: 12px; background: #07090e; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-size: 14px; margin: 6px 0 14px; outline: none; }
    .modal-box input:focus { border-color: var(--cyan); }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="user-profile">
      <div class="avatar-icon">⚡</div>
      <div>
        <h3 id="ui-username">...</h3>
        <p id="ui-userid" style="font-size: 11px; color: var(--dim); font-family: monospace;">ID: ...</p>
      </div>
    </div>
    <div class="status-badge" id="bot-status-tag">SYSTEM ONLINE</div>
  </div>

  <div class="balance-box">
    <div style="font-size: 11px; color: var(--dim); text-transform: uppercase;">လက်ကျန်ငွေ (USDT BEP-20)</div>
    <div class="balance-val">$<span id="ui-balance">0.0000</span></div>
    <div style="font-size: 12px; color: var(--cyan);" id="ui-rate-info">Ad ဆုကြေး: $0.003 / Ad</div>
  </div>

  <div class="btn-grid">
    <button class="cyber-btn btn-earn" id="btn-watch-ad">⚡ Ads ကြည့်မည်</button>
    <button class="cyber-btn btn-withdraw" id="btn-open-withdraw">💳 Withdraw</button>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-btn-tasks">📋 Tasks & Earn</button>
    <button class="tab-btn" id="tab-btn-history">📜 ငွေထုတ်မှတ်တမ်း</button>
  </div>

  <!-- Tab 1: Tasks -->
  <div id="tab-tasks-content">
    <div class="card-item">
      <div>
        <h4>Daily Bonus</h4>
        <p style="font-size:11px; color:var(--dim);" id="daily-text">၂၄ နာရီတစ်ကြိမ် ရယူပါ</p>
      </div>
      <button class="btn-action" id="btn-daily">Claim</button>
    </div>

    <div class="card-item">
      <div>
        <h4>Invite Friends (<span id="ref-percent-text">20</span>%)</h4>
        <p style="font-size:11px; color:var(--dim);">မိတ်ဆက်ဆုကြေး ရယူရန်</p>
      </div>
      <button class="btn-action" id="btn-share">Share</button>
    </div>

    <div id="tasks-container">
      <p style="font-size:12px; color:var(--dim); padding:10px 0;">Tasks များကို ဆွဲယူနေပါသည်...</p>
    </div>
  </div>

  <!-- Tab 2: Withdraw History -->
  <div id="tab-history-content" style="display: none;">
    <div id="history-container">
      <p style="font-size:12px; color:var(--dim); padding:10px 0;">မှတ်တမ်း မရှိသေးပါ။</p>
    </div>
  </div>

  <!-- Alert Modal -->
  <div class="modal-overlay" id="modal-alert">
    <div class="modal-box" style="text-align: center;">
      <h3 id="alert-title" style="margin-bottom: 8px;">အသိပေးချက်</h3>
      <p id="alert-msg" style="color: var(--dim); font-size: 13px; margin-bottom: 18px; line-height: 1.5;"></p>
      <button class="cyber-btn btn-earn" style="width: 100%; padding:13px;" id="alert-ok-btn">ကောင်းပြီ</button>
    </div>
  </div>

  <!-- Withdraw Modal -->
  <div class="modal-overlay" id="modal-withdraw">
    <div class="modal-box">
      <h3 style="margin-bottom: 4px; text-align: center;">USDT BEP-20 ထုတ်ယူရန်</h3>
      <p style="font-size: 11px; color: var(--dim); text-align: center; margin-bottom: 12px;" id="withdraw-hint">အနည်းဆုံး $0.03 မှ ထုတ်နိုင်ပါသည်</p>
      <div id="withdraw-msg-box" style="display: none; padding: 10px; border-radius: 8px; font-size: 12px; text-align: center; margin-bottom: 12px; font-weight: bold;"></div>

      <label style="font-size: 11px; color: var(--dim);">ထုတ်ယူမည့် ပမာဏ ($)</label>
      <input type="number" id="input-amount" step="0.001" placeholder="0.03">

      <label style="font-size: 11px; color: var(--dim);">BEP-20 Wallet Address (0x...)</label>
      <input type="text" id="input-wallet" placeholder="0x...">

      <button class="cyber-btn btn-withdraw" style="width: 100%; margin-bottom: 8px; padding:13px;" id="btn-submit-withdraw">ငွေထုတ်တောင်းဆိုမည်</button>
      <button class="cyber-btn" style="width: 100%; background: #161c2d; color: white; padding:13px;" id="btn-close-withdraw">ပိတ်မည်</button>
    </div>
  </div>

  <script>
    const SB_URL = "https://ohhzbeayfccoiqevydat.supabase.co";
    const SB_KEY = "sb_publishable_ZRsi0oPdmbAY-wimQ5Cx8A_b_g_PY41";
    const BOT_TOKEN = "9006366554:AAGSMmQtUHPhzUlvDdVcmBlzBE52x3ZrzKA";
    const ADMIN_ID = 6093710107;
    const BOT_USERNAME = "CyberEarns_bot";

    const tg = window.Telegram?.WebApp;
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

    const userData = tg?.initDataUnsafe?.user || { id: 6093710107, first_name: "Admin" };

    let config = { bot_status: 'ON', ad_reward: 0.003, min_withdraw: 0.03, daily_bonus: 0.005, ref_percent: 20 };
    let currentBalance = 0.000;
    let lastDaily = 0;
    let completedTasks = [];

    function showAlert(title, msg) {
      document.getElementById("alert-title").innerText = title;
      document.getElementById("alert-msg").innerText = msg;
      document.getElementById("modal-alert").classList.add("active");
    }

    document.getElementById("alert-ok-btn").addEventListener("click", () => document.getElementById("modal-alert").classList.remove("active"));
    document.getElementById("btn-close-withdraw").addEventListener("click", () => document.getElementById("modal-withdraw").classList.remove("active"));

    // Tab Navigation
    document.getElementById("tab-btn-tasks").addEventListener("click", () => {
      document.getElementById("tab-btn-tasks").classList.add("active");
      document.getElementById("tab-btn-history").classList.remove("active");
      document.getElementById("tab-tasks-content").style.display = "block";
      document.getElementById("tab-history-content").style.display = "none";
    });

    document.getElementById("tab-btn-history").addEventListener("click", () => {
      document.getElementById("tab-btn-history").classList.add("active");
      document.getElementById("tab-btn-tasks").classList.remove("active");
      document.getElementById("tab-tasks-content").style.display = "none";
      document.getElementById("tab-history-content").style.display = "block";
      loadWithdrawHistory();
    });

    function showWithdrawNotice(text, isError = true) {
      const box = document.getElementById("withdraw-msg-box");
      box.style.display = "block";
      box.innerText = text;
      box.style.background = isError ? "rgba(255, 51, 102, 0.15)" : "rgba(0, 255, 136, 0.15)";
      box.style.color = isError ? "#ff3366" : "#00ff88";
      box.style.border = isError ? "1px solid #ff3366" : "1px solid #00ff88";
    }

    function renderUI() {
      document.getElementById("ui-username").innerText = userData.first_name;
      document.getElementById("ui-userid").innerText = `ID: ${userData.id}`;
      document.getElementById("ui-balance").innerText = currentBalance.toFixed(4);
      document.getElementById("ui-rate-info").innerText = `Ad ဆုကြေး: $${config.ad_reward} / Ad`;
      document.getElementById("withdraw-hint").innerText = `အနည်းဆုံး $${config.min_withdraw} မှ ထုတ်နိုင်ပါသည်`;
      document.getElementById("daily-text").innerText = `၂၄ နာရီတစ်ကြိမ် $${config.daily_bonus} ရယူပါ`;
      document.getElementById("ref-percent-text").innerText = config.ref_percent;
    }

    // Live Fetch from Supabase directly
    async function syncDataFromDB() {
      try {
        const uRes = await fetch(`${SB_URL}/rest/v1/cyber_users?id=eq.${userData.id}`, {
          headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
        });
        const uData = await uRes.json();
        if (uData.length > 0) {
          currentBalance = Number(uData[0].balance || 0);
          lastDaily = Number(uData[0].last_daily || 0);
        } else {
          await fetch(`${SB_URL}/rest/v1/cyber_users`, {
            method: "POST",
            headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({ id: userData.id, name: userData.first_name, balance: 0.000 })
          });
        }

        const sRes = await fetch(`${SB_URL}/rest/v1/cyber_settings?select=*`, {
          headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
        });
        const sData = await sRes.json();
        sData.forEach(item => {
          if (item.key === 'bot_status') config.bot_status = item.value;
          if (item.key === 'ad_reward') config.ad_reward = Number(item.value);
          if (item.key === 'min_withdraw') config.min_withdraw = Number(item.value);
          if (item.key === 'daily_bonus') config.daily_bonus = Number(item.value);
          if (item.key === 'ref_percent') config.ref_percent = Number(item.value);
        });

        const cRes = await fetch(`${SB_URL}/rest/v1/cyber_completed_tasks?user_id=eq.${userData.id}`, {
          headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
        });
        const cData = await cRes.json();
        completedTasks = cData.map(c => c.task_id);

        const tRes = await fetch(`${SB_URL}/rest/v1/cyber_tasks?select=*`, {
          headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
        });
        const tasks = await tRes.json();
        const container = document.getElementById("tasks-container");
        container.innerHTML = "";

        tasks.forEach(t => {
          const isDone = completedTasks.includes(t.id);
          const div = document.createElement("div");
          div.className = "card-item";
          div.innerHTML = `
            <div>
              <h4>${t.title}</h4>
              <p style="color:var(--green); font-weight:700;">+$${Number(t.reward).toFixed(3)} USDT</p>
            </div>
            <button class="btn-action" id="task-btn-${t.id}" ${isDone ? "disabled" : ""}>
              ${isDone ? "Done" : "Start"}
            </button>
          `;
          container.appendChild(div);

          if (!isDone) {
            div.querySelector(`#task-btn-${t.id}`).addEventListener("click", () => handleDynamicTask(t));
          }
        });

        renderUI();
      } catch (e) {
        console.error(e);
      }
    }

    async function updateBalanceInDB(newBal) {
      currentBalance = newBal;
      renderUI();
      await fetch(`${SB_URL}/rest/v1/cyber_users?id=eq.${userData.id}`, {
        method: "PATCH",
        headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ balance: newBal })
      });
    }

    // Ads Watch
    let isWatching = false;
    document.getElementById("btn-watch-ad").addEventListener("click", () => {
      if (config.bot_status === 'OFF') {
        showAlert("ခေတ္တစောင့်ပါ", "စနစ်ပြုပြင်ထိန်းသိမ်းနေသဖြင့် Ads ခေတ္တပိတ်ထားပါသည်။");
        return;
      }
      if (isWatching) return;
      isWatching = true;

      let c = 5;
      const b = document.getElementById("btn-watch-ad");
      b.innerText = `⏳ ကြည့်ရှုနေသည် (${c}s)...`;

      const t = setInterval(() => {
        c--;
        if (c > 0) {
          b.innerText = `⏳ ကြည့်ရှုနေသည် (${c}s)...`;
        } else {
          clearInterval(t);
          b.innerText = "⚡ Ads ကြည့်မည်";
          isWatching = false;

          const nBal = Number((currentBalance + config.ad_reward).toFixed(4));
          updateBalanceInDB(nBal);
          showAlert("🎉 အောင်မြင်ပါသည်", `ကြော်ငြာအတွက် +$${config.ad_reward} ရရှိပါသည်!`);
        }
      }, 1000);
    });

    // Daily Bonus
    document.getElementById("btn-daily").addEventListener("click", async () => {
      const now = Date.now();
      if (now - lastDaily < 24 * 60 * 60 * 1000) {
        showAlert("ခေတ္တစောင့်ပါ", "ယနေ့အတွက် Daily Bonus ရယူပြီးပါပြီ။");
        return;
      }
      const nBal = Number((currentBalance + config.daily_bonus).toFixed(4));
      lastDaily = now;
      await fetch(`${SB_URL}/rest/v1/cyber_users?id=eq.${userData.id}`, {
        method: "PATCH",
        headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ balance: nBal, last_daily: now })
      });
      currentBalance = nBal;
      renderUI();
      showAlert("🎁 နေ့စဉ်ဆု", `Daily Bonus +$${config.daily_bonus} ထည့်သွင်းပေးလိုက်ပါပြီ!`);
    });

    // Task Execution
    function handleDynamicTask(task) {
      if (tg?.openLink) { tg.openLink(task.link); } else { window.open(task.link, "_blank"); }
      const b = document.getElementById(`task-btn-${task.id}`);
      b.innerText = "စစ်ဆေးနေသည်...";

      setTimeout(async () => {
        completedTasks.push(task.id);
        const nBal = Number((currentBalance + Number(task.reward)).toFixed(4));
        b.innerText = "Done";
        b.disabled = true;

        await fetch(`${SB_URL}/rest/v1/cyber_completed_tasks`, {
          method: "POST",
          headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userData.id, task_id: task.id })
        });
        updateBalanceInDB(nBal);
        showAlert("✅ Task အောင်မြင်ပါသည်", `ဆုကြေး +$${Number(task.reward).toFixed(3)} ရရှိပါသည်!`);
      }, 3500);
    }

    // Withdraw History Loader
    async function loadWithdrawHistory() {
      const container = document.getElementById("history-container");
      container.innerHTML = "<p style='font-size:12px; color:var(--dim);'>မှတ်တမ်း ဆွဲယူနေပါသည်...</p>";
      try {
        const res = await fetch(`${SB_URL}/rest/v1/cyber_withdrawals?user_id=eq.${userData.id}&order=created_at.desc`, {
          headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
        });
        const list = await res.json();
        if (list.length === 0) {
          container.innerHTML = "<p style='font-size:12px; color:var(--dim); padding:10px 0;'>ငွေထုတ်မှတ်တမ်း မရှိသေးပါ။</p>";
          return;
        }
        container.innerHTML = "";
        list.forEach(item => {
          const isApp = (item.status === 'Approved');
          const div = document.createElement("div");
          div.className = "card-item";
          div.innerHTML = `
            <div>
              <h4>$${item.amount} USDT</h4>
              <p style="font-size:10px; color:var(--dim); font-family:monospace;">${item.wallet_address.substring(0,6)}...${item.wallet_address.substring(item.wallet_address.length - 4)}</p>
            </div>
            <span style="font-size:11px; font-weight:700; color: ${isApp ? 'var(--green)' : 'var(--cyan)'};">${item.status}</span>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        container.innerHTML = "<p style='font-size:12px; color:var(--danger);'>မှတ်တမ်းဆွဲယူ၍ မရပါ။</p>";
      }
    }

    // Submit Withdraw & Notify Admin Instantly
    document.getElementById("btn-open-withdraw").addEventListener("click", () => {
      document.getElementById("withdraw-msg-box").style.display = "none";
      document.getElementById("input-amount").value = "";
      document.getElementById("input-wallet").value = "";
      document.getElementById("modal-withdraw").classList.add("active");
    });

    document.getElementById("btn-submit-withdraw").addEventListener("click", async () => {
      if (config.bot_status === 'OFF') {
        showWithdrawNotice("⚠️ စနစ်ပြုပြင်နေသဖြင့် ငွေထုတ်ယူမှု ခေတ္တပိတ်ထားပါသည်။", true);
        return;
      }
      const amt = Number(document.getElementById("input-amount").value);
      const addr = document.getElementById("input-wallet").value.trim();

      if (!amt || amt < config.min_withdraw) {
        showWithdrawNotice(`⚠️ အနည်းဆုံး $${config.min_withdraw} မှ ထုတ်ယူနိုင်ပါမည်။`, true);
        return;
      }
      if (amt > currentBalance) {
        showWithdrawNotice("⚠️ လက်ကျန်ငွေ မလုံလောက်ပါ။", true);
        return;
      }
      if (!addr.startsWith("0x") || addr.length < 40) {
        showWithdrawNotice("⚠️ မှန်ကန်သော BEP-20 (0x...) Address ထည့်ပါ။", true);
        return;
      }

      const nBal = Number((currentBalance - amt).toFixed(4));
      updateBalanceInDB(nBal);

      const res = await fetch(`${SB_URL}/rest/v1/cyber_withdrawals`, {
        method: "POST",
        headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
        body: JSON.stringify({ user_id: userData.id, amount: amt, wallet_address: addr, status: "Pending" })
      });
      const data = await res.json();
      const orderId = data[0]?.id || "New";

      // Telegram Bot API ဖြင့် Admin ထံ တိုက်ရိုက် Alert ပို့ခြင်း
      const alertText = `🔔 *ငွေထုတ်တောင်းဆိုမှု အသစ် ရရှိပါသည်!*\n\n🆔 *Order ID:* \`${orderId}\`\n👤 *User:* ${userData.first_name} (\`${userData.id}\`)\n💰 *ပမာဏ:* \`$${amt} USDT\`\n🔗 *Address (BEP-20):*\n\`${addr}\`\n\n👉 အတည်ပြုရန်: \`/approve ${orderId}\``;
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: ADMIN_ID, text: alertText, parse_mode: "Markdown" })
      }).catch(() => {});

      showWithdrawNotice(`✅ $${amt} USDT ထုတ်ယူမှု အောင်မြင်ပါသည်။ Admin ဆီသို့ စာပို့လိုက်ပါပြီ။`, false);
      document.getElementById("input-amount").value = "";
      document.getElementById("input-wallet").value = "";

      setTimeout(() => {
        document.getElementById("modal-withdraw").classList.remove("active");
      }, 2500);
    });

    // Invite Link (@CyberEarns_bot အတိအကျ သုံးထားပါသည်)
    document.getElementById("btn-share").addEventListener("click", () => {
      const link = `https://t.me/${BOT_USERNAME}?start=${userData.id}`;
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent("Cyber Earn မှာ Ads ကြည့်ပြီး USDT ဝင်ငွေရှာကြစို့!")}`);
      } else {
        navigator.clipboard.writeText(link);
        showAlert("Invite Link", "သင့် Link ကို ကူးယူပြီးပါပြီ:\n" + link);
      }
    });

    syncDataFromDB();
  </script>
